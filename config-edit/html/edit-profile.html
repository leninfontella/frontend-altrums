<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Perfil</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../config-edit/css/edit-profile.css" />
  </head>
  <body>
    <div class="phone-container">
      <div class="design-label">EDITAR PERFIL</div>
      <div class="screen">
        <div class="status-bar">
          <span>9:41</span>
          <div style="display: flex; gap: 6px; align-items: center">
            <i class="fas fa-signal" style="font-size: 12px"></i>
            <i class="fas fa-wifi" style="font-size: 12px"></i>
            <i
              class="fas fa-battery-three-quarters"
              style="font-size: 12px"
            ></i>
          </div>
        </div>
        <div class="notch"></div>

        <div class="header">
          <div class="header-left">
            <button id="go-back" class="back-button">
              <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="header-title">Editar Perfil</h1>
          </div>
          <button class="save-button" onclick="saveProfile()">
            <i class="fas fa-check"></i>
          </button>
        </div>

        <div class="content">
          <div class="main-content">
            <div class="profile-photo-card">
              <img id="profile-image" src="" alt="User Profile Photo" />
              <input
                type="file"
                id="photo-input"
                class="hidden-input"
                accept="image/*"
              />
              <div class="photo-controls">
                <button
                  class="change-photo-btn"
                  onclick="document.getElementById('photo-input').click()"
                >
                  <i class="fas fa-camera"></i>
                  Trocar Foto
                </button>
                <button
                  class="remove-photo-btn"
                  onclick="showRemovePhotoModal()"
                >
                  <i class="fas fa-trash"></i>
                  Remover Foto
                </button>
              </div>
            </div>

            <div class="section" style="animation-delay: 0.2s">
              <div class="section-subtitle">Informações Principais</div>

              <div class="form-group">
                <label for="name">Nome Completo:</label>
                <input
                  type="text"
                  id="name"
                  value="Jane Doe"
                  placeholder="Digite seu nome completo"
                />
              </div>

              <div class="form-group">
                <label for="email">Email:</label>
                <input
                  type="email"
                  id="email"
                  value="jane.doe@example.com"
                  placeholder="Digite seu email"
                />
              </div>

              <div class="form-group">
                <label for="phone">Atualize o seu Telefone:</label>
                <input
                  type="tel"
                  id="phone"
                  value="+55 (11) 98765-4321"
                  placeholder="Digite seu telefone"
                />
              </div>
            </div>
          </div>

          <button
            class="save-content-btn"
            onclick="saveProfile()"
            style="margin-top: 24px"
          >
            Salvar Informações
          </button>
        </div>
      </div>
    </div>

    <div id="message-box" class="success-message">
      Perfil salvo com sucesso!
    </div>

    <!-- Modal de Confirmação para Remover Foto -->
    <div id="remove-photo-modal" class="modal-overlay">
      <div class="modal-container">
        <div class="modal-header">
          <i class="fas fa-trash-alt modal-icon"></i>
          <h3 class="modal-title">Remover Foto</h3>
        </div>
        <div class="modal-body">
          <p class="modal-text">
            Tem certeza que deseja remover sua foto de perfil? Esta ação não
            pode ser desfeita.
          </p>
        </div>
        <div class="modal-actions">
          <button
            class="modal-btn modal-btn-cancel"
            onclick="closeRemovePhotoModal()"
          >
            <i class="fas fa-times"></i>
            Cancelar
          </button>
          <button
            class="modal-btn modal-btn-confirm"
            onclick="confirmRemovePhoto()"
          >
            <i class="fas fa-trash"></i>
            Remover
          </button>
        </div>
      </div>
    </div>

    <!-- Modal de Confirmação para Alterações não salvas -->
    <div id="unsaved-modal" class="modal-overlay">
      <div class="modal-container">
        <div class="modal-header">
          <i
            class="fas fa-exclamation-triangle modal-icon"
            style="color: #ffc107"
          ></i>
          <h3 class="modal-title">Alterações não salvas</h3>
        </div>
        <div class="modal-body">
          <p class="modal-text">
            Você tem alterações não salvas. Deseja continuar?
          </p>
        </div>
        <div class="modal-actions">
          <button
            class="modal-btn modal-btn-cancel"
            onclick="closeUnsavedChangesModal()"
          >
            <i class="fas fa-arrow-left"></i>
            Permanecer
          </button>
          <button
            class="modal-btn modal-btn-confirm"
            onclick="confirmLeaveWithUnsavedChanges()"
          >
            <i class="fas fa-sign-out-alt"></i>
            Sair sem salvar
          </button>
        </div>
      </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../config-edit/js/apiConfig.js"></script>
    <script src="../../config-edit/js/edit-profile.js"></script>
  </body>
</html>
