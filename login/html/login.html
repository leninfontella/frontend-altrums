<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Living Coins</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="phone-container">
      <div class="design-label">LOGIN COINS</div>
      <div class="screen">
        <div class="notch"></div>
        <div class="status-bar">
          <span>9:41</span>
          <div style="display: flex; gap: 6px; align-items: center">
            <i class="fas fa-signal" style="font-size: 12px"></i>
            <i class="fas fa-wifi" style="font-size: 12px"></i>
            <i
              class="fas fa-battery-three-quarters"
              style="font-size: 12px"
            ></i>
          </div>
        </div>
        <div class="floating-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        <div class="login-container">
          <div class="header-section">
            <div class="logo-container">
              <i class="fas fa-coins logo-icon"></i>
            </div>
            <h1 class="app-title">Altrums Coins</h1>
            <p class="app-subtitle">
              Conecte-se ao futuro da generosidade digital.
            </p>
          </div>
          <div class="form-section">
            <form id="formLogin">
              <div class="input-group">
                <label class="input-label">E-mail</label>
                <div class="input-wrapper">
                  <input
                    type="email"
                    class="input-field"
                    placeholder="Digite seu e-mail"
                    id="email"
                    required
                    autocomplete="username"
                  />
                  <i class="fas fa-envelope input-icon"></i>
                </div>
                <div class="error-message" id="email-error"></div>
              </div>
              <div class="input-group">
                <label class="input-label">Senha</label>
                <div class="input-wrapper">
                  <input
                    type="password"
                    class="input-field"
                    placeholder="Digite sua senha"
                    id="password"
                    required
                    autocomplete="current-password"
                  />
                  <i class="fas fa-lock input-icon"></i>
                  <i class="fas fa-eye password-toggle"></i>
                </div>
                <div class="error-message" id="password-error"></div>
                <div class="form-options">
                  <div class="remember-me-container">
                    <div class="checkbox-wrapper">
                      <input
                        type="checkbox"
                        id="rememberMe"
                        class="checkbox-input"
                      />
                      <label for="rememberMe" class="checkbox-custom"></label>
                    </div>
                    <label for="rememberMe" class="checkbox-label">
                      Lembre de mim
                    </label>
                  </div>
                  <div class="forgot-password">
                    <a href="../../forgot-password/html/forgot-password.html"
                      >Esqueceu a senha?</a
                    >
                  </div>
                </div>
              </div>
              <button type="submit" class="login-button">
                <i class="fas fa-sign-in-alt" style="margin-right: 8px"></i>
                Acessar
              </button>
            </form>
            <div class="register-section">
              <p class="register-text">Não tem uma conta?</p>
              <a href="../../register/html/signup.html" class="register-link">
                <span>Registrar</span>
                <div class="coin-balance">
                  <i class="fas fa-coins"></i>
                  Comece a doar!
                </div>
                <i class="fas fa-arrow-right"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Overlay de Loading -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
    </div>

    <!-- Feedback de Sucesso -->
    <div class="success-feedback" id="successFeedback">
      <i class="fas fa-check-circle"></i>
      <span>Login realizado com sucesso!</span>
      <div class="coin-balance">
        <i class="fas fa-coins"></i>
        <span id="userBalance">0</span>
      </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
