<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking - Altrum Coins</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../assets/css/ranking-ranks.css" />
  </head>
  <body>
    <div class="screen">
      <div class="floating-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>

      <div class="ranking-container">
        <div class="header">
          <button class="back-button" id="back-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="header-title">Ranking Altrums</div>
          <div class="header-space"></div>
        </div>

        <div class="main-content">
          <!-- Posição do usuário atual -->
          <div class="current-user-card">
            <div class="user-rank-badge" id="user-position">8</div>
            <div class="user-info">
              <h3 id="user-name">Usuário</h3>
              <div class="user-balance">
                <div class="coin-icon">₿</div>
                <span id="user-balance">2.050</span>
              </div>
            </div>
          </div>

          <!-- Pódium -->
          <div class="section-title">
            <i class="fas fa-crown"></i>
            Top 3
          </div>

          <div class="podium-container">
            <!-- 2º Lugar -->
            <div class="podium-item second">
              <div class="podium-rank">2</div>
              <div class="podium-avatar silver">
                <i class="fas fa-user"></i>
              </div>
              <div class="podium-name">...</div>
              <div class="podium-balance">
                <div class="coin-icon">₿</div>
                <span>...</span>
              </div>
            </div>

            <!-- 1º Lugar -->
            <div class="podium-item first">
              <div class="podium-rank">1</div>
              <div class="podium-crown">
                <i class="fas fa-crown"></i>
              </div>
              <div class="podium-avatar gold">
                <i class="fas fa-user"></i>
              </div>
              <div class="podium-name">...</div>
              <div class="podium-balance">
                <div class="coin-icon">₿</div>
                <span>...</span>
              </div>
            </div>

            <!-- 3º Lugar -->
            <div class="podium-item third">
              <div class="podium-rank">3</div>
              <div class="podium-avatar bronze">
                <i class="fas fa-user"></i>
              </div>
              <div class="podium-name">...</div>
              <div class="podium-balance">
                <div class="coin-icon">₿</div>
                <span>...</span>
              </div>
            </div>
          </div>

          <!-- Ranking Completo -->
          <div class="section-title">
            <i class="fas fa-list-ol"></i>
            Ranking Completo
          </div>

          <div class="total-users">Carregando usuários...</div>

          <!-- Lista de ranking será preenchida via JavaScript -->
          <div class="ranking-list">
            <!-- Os itens serão inseridos dinamicamente -->
          </div>
        </div>

        <div class="bottom-nav">
          <div class="nav-item" id="nav-home">
            <i class="fas fa-home"></i>
            <span>Início</span>
          </div>
          <div class="nav-item" id="nav-timeline">
            <i class="fas fa-history"></i>
            <span>Timeline</span>
          </div>
          <div class="nav-item active">
            <i class="fas fa-trophy"></i>
            <span>Ranking</span>
          </div>
          <div class="nav-item" id="nav-profile">
            <i class="fas fa-user-circle"></i>
            <span>Perfil</span>
          </div>
        </div>
      </div>
    </div>

    <script src="../../../assets/js/config-edit-apiConfig.js"></script>
    <script src="../../../assets/js/config-edit-userService.js"></script>
    <script src="../../../assets/js/config-edit-globalInit.js"></script>
    <script src="../../../assets/js/ranking-ranks.js"></script>
    <script src="../../../assets/js/ranking-pull-to-refresh.js"></script>
  </body>
</html>
