<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - 1lênin1dev</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/register-signup.css" />
  </head>
  <body>
    <div class="screen">
      <div class="floating-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>

      <div class="signup-container">
        <div class="header-section">
          <div class="logo-container">
            <i class="fas fa-coins logo-icon"></i>
          </div>
          <h1 class="app-title">Altrum Coins</h1>
          <p class="app-subtitle">
            Conecte-se ao futuro da generosidade digital.
          </p>
        </div>

        <form class="signup-form">
          <div class="input-group">
            <div class="input-wrapper">
              <input
                type="text"
                class="input-field"
                placeholder="Nome completo"
                id="name"
              />
              <i class="fas fa-user input-icon"></i>
            </div>
            <div class="input-wrapper spaced-input">
              <input
                type="email"
                class="input-field"
                placeholder="Seu melhor e-mail"
                id="email"
              />
              <i class="fas fa-envelope input-icon"></i>
            </div>
            <div class="input-wrapper spaced-input">
              <input
                type="tel"
                class="input-field"
                placeholder="Seu telefone"
                id="phone"
              />
              <i class="fas fa-phone input-icon"></i>
            </div>
            <div class="input-wrapper spaced-input">
              <input
                type="password"
                class="input-field"
                placeholder="Crie uma senha"
                id="password"
              />
              <i class="fas fa-lock input-icon"></i>
              <i
                class="fas fa-eye password-toggle"
                onclick="togglePassword('password')"
              ></i>
            </div>

            <!-- Indicador de força da senha -->
            <div
              class="password-strength"
              id="passwordStrength"
              style="display: none"
            >
              <div class="strength-indicator">
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
              </div>
              <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="input-wrapper spaced-input">
              <input
                type="password"
                class="input-field"
                placeholder="Confirme sua senha"
                id="confirmPassword"
              />
              <i class="fas fa-lock input-icon"></i>
              <i
                class="fas fa-eye password-toggle"
                onclick="togglePassword('confirmPassword')"
              ></i>
            </div>
          </div>

          <div class="terms-section">
            <div class="checkbox-wrapper">
              <input type="checkbox" class="checkbox" id="terms" />
            </div>
            <div class="terms-text">
              Concordo com os
              <a href="/pages/term-and-policies/html/index.html"
                >Termos de Uso</a
              >
              e
              <a href="/pages/term-and-policies/html/index.html"
                >Política de Privacidade</a
              >
              do CoinFuture
            </div>
          </div>

          <button class="signup-button" id="signupBtn" disabled>
            Criar Minha Conta
          </button>
        </form>

        <div class="login-section">
          <p class="login-text">Já possui uma conta?</p>
          <a href="/index.html" class="login-link">Fazer Login</a>
        </div>
      </div>
    </div>

    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/register-signup.js"></script>
  </body>
</html>
