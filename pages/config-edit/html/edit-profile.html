<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Perfil</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="../../../assets/css/config-edit-edit-profile.css"
    />
  </head>
  <body>
    <div class="floating-particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <div class="main-container">
      <div class="header-section">
        <button id="go-back" class="back-button" onclick="goBack()">
          <i class="fas fa-chevron-left"></i>
        </button>
        <h1 class="header-title">Editar Perfil</h1>
        <button class="save-button" onclick="saveProfile()">
          <i class="fas fa-check"></i>
        </button>
      </div>

      <div class="content-container">
        <div class="main-content">
          <div class="profile-photo-card">
            <img id="profile-image" src="" alt="User Profile Photo" />
            <input
              type="file"
              id="photo-input"
              class="hidden-input"
              accept="image/*"
            />
            <div class="photo-controls">
              <button
                class="change-photo-btn"
                onclick="document.getElementById('photo-input').click()"
              >
                <i class="fas fa-camera"></i>
                Trocar Foto
              </button>
              <button class="remove-photo-btn" onclick="showRemovePhotoModal()">
                <i class="fas fa-trash"></i>
                Remover Foto
              </button>
            </div>
          </div>

          <div class="section" style="animation-delay: 0.2s">
            <div class="section-subtitle">Informações Principais</div>

            <div class="form-group">
              <label for="name">Nome Completo:</label>
              <input
                type="text"
                id="name"
                value="Jane Doe"
                placeholder="Digite seu nome completo"
              />
            </div>

            <div class="form-group">
              <label for="email">Email:</label>
              <input
                type="email"
                id="email"
                value="jane.doe@example.com"
                placeholder="Digite seu email"
              />
            </div>

            <div class="form-group">
              <label for="phone">Atualize o seu Telefone:</label>
              <input
                type="tel"
                id="phone"
                value="+55 (11) 98765-4321"
                placeholder="Digite seu telefone"
              />
            </div>
          </div>
        </div>

        <button
          class="save-content-btn"
          onclick="saveProfile()"
          style="margin-top: 24px"
        >
          Salvar Informações
        </button>
      </div>
    </div>

    <div id="message-box" class="success-message">
      Perfil salvo com sucesso!
    </div>

    <div id="remove-photo-modal" class="modal-overlay">
      <div class="modal-container">
        <div class="modal-header">
          <i class="fas fa-trash-alt modal-icon"></i>
          <h3 class="modal-title">Remover Foto</h3>
        </div>
        <div class="modal-body">
          <p class="modal-text">
            Tem certeza que deseja remover sua foto de perfil? Esta ação não
            pode ser desfeita.
          </p>
        </div>
        <div class="modal-actions">
          <button
            class="modal-btn modal-btn-cancel"
            onclick="closeRemovePhotoModal()"
          >
            <i class="fas fa-times"></i>
            Cancelar
          </button>
          <button
            class="modal-btn modal-btn-confirm"
            onclick="confirmRemovePhoto()"
          >
            <i class="fas fa-trash"></i>
            Remover
          </button>
        </div>
      </div>
    </div>

    <div id="unsaved-modal" class="modal-overlay">
      <div class="modal-container">
        <div class="modal-header">
          <i
            class="fas fa-exclamation-triangle modal-icon"
            style="color: #ffc107"
          ></i>
          <h3 class="modal-title">Alterações não salvas</h3>
        </div>
        <div class="modal-body">
          <p class="modal-text">
            Você tem alterações não salvas. Deseja continuar?
          </p>
        </div>
        <div class="modal-actions">
          <button
            class="modal-btn modal-btn-cancel"
            onclick="closeUnsavedChangesModal()"
          >
            <i class="fas fa-arrow-left"></i>
            Permanecer
          </button>
          <button
            class="modal-btn modal-btn-confirm"
            onclick="confirmLeaveWithUnsavedChanges()"
          >
            <i class="fas fa-sign-out-alt"></i>
            Sair
          </button>
        </div>
      </div>
    </div>

    <script src="../../../assets/js/config-edit-apiConfig.js"></script>
    <script src="../../../assets/js/config-edit-userService.js"></script>
    <script src="../../../assets/js/auth.js"></script>
    <script src="../../../assets/js/websocket-client.js"></script>
    <script src="../../../assets/js/config-edit-globalInit.js"></script>

    <!-- Script específico da página de edição -->
    <script src="../../../assets/js/config-edit-edit-profile.js"></script>
  </body>
</html>
