<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suporte - Altrum Coins</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../assets/css/support-suporte.css" />
  </head>
  <body>
    <div class="screen">
      <div class="floating-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>

      <div class="support-container">
        <div class="header">
          <button id="go-back" class="back-button">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="header-title">Suporte</div>
          <div class="header-spacer"></div>
        </div>

        <div class="main-content">
          <!-- Hero Section -->
          <div class="hero-section">
            <div class="hero-icon">
              <i class="fas fa-headset"></i>
            </div>
            <h1 class="hero-title">Como podemos ajudar?</h1>
            <p class="hero-description">
              Estamos aqui para garantir a melhor experiência com o Altrum Coins
            </p>
          </div>

          <!-- Support Options -->
          <div class="section-title">
            <i class="fas fa-phone-volume"></i>
            <span>Entre em Contato</span>
          </div>

          <div class="support-options">
            <a href="#" class="support-option" id="whatsapp-option">
              <div class="option-icon whatsapp">
                <i class="fab fa-whatsapp"></i>
              </div>
              <div class="option-content">
                <div class="option-title">WhatsApp</div>
                <div class="option-description">
                  Converse conosco pelo WhatsApp para suporte rápido
                </div>
              </div>
              <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <a href="#" class="support-option" id="email-option">
              <div class="option-icon email">
                <i class="fas fa-envelope"></i>
              </div>
              <div class="option-content">
                <div class="option-title">E-mail</div>
                <div class="option-description">
                  Envie um e-mail para altrum.no.reply@gmail.com
                </div>
              </div>
              <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
          </div>

          <!-- Social Media Section -->
          <div class="section-title">
            <i class="fas fa-share-alt"></i>
            <span>Redes Sociais</span>
          </div>

          <div class="social-description">
            Acompanhe nossas novidades e conecte-se conosco
          </div>

          <div class="social-media-grid">
            <a href="#" class="social-link instagram" data-social="Instagram">
              <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="social-link youtube" data-social="YouTube">
              <i class="fab fa-youtube"></i>
            </a>
            <a href="#" class="social-link facebook" data-social="Facebook">
              <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="social-link discord" data-social="Discord">
              <i class="fab fa-discord"></i>
            </a>
            <a href="#" class="social-link tiktok" data-social="TikTok">
              <i class="fab fa-tiktok"></i>
            </a>
            <a href="#" class="social-link twitter" data-social="X">
              <i class="fa-brands fa-twitter"></i>
            </a>
            <a href="#" class="social-link linkedin" data-social="LinkedIn">
              <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="#" class="social-link telegram" data-social="Telegram">
              <i class="fab fa-telegram-plane"></i>
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="../../../assets/js/support-suporte.js"></script>
  </body>
</html>
