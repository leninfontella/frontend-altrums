<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      href="https://i.ibb.co/q3TwvWPz/Chat-GPT-Image-23-de-ago-de-2025-19-32-11.png"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="https://i.ibb.co/q3TwvWPz/Chat-GPT-Image-23-de-ago-de-2025-19-32-11.png"
    />

    <!-- ===== OPEN GRAPH META TAGS ===== -->
    <!-- Aparecem quando o link é compartilhado em redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://altrum.vercel.app/" />
    <meta property="og:title" content="Altrum - Coins" />
    <meta
      property="og:description"
      content="Conecte-se ao futuro da generosidade digital."
    />
    <meta
      property="og:image"
      content="https://i.ibb.co/q3TwvWPz/Chat-GPT-Image-23-de-ago-de-2025-19-32-11.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Altrum - Economia de Favores" />
    <meta
      name="twitter:description"
      content="Conecte-se ao futuro da generosidade digital."
    />
    <meta
      name="twitter:image"
      content="https://i.ibb.co/q3TwvWPz/Chat-GPT-Image-23-de-ago-de-2025-19-32-11.png"
    />

    <!-- METADADOS ADICIONAIS -->
    <meta name="theme-color" content="#6C4CE1" />
    <meta
      name="description"
      content="Altrum - Plataforma de economia de favores. Conecte-se ao futuro da generosidade digital."
    />

    <title>Login - Altrum</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/login.css" />
  </head>
  <body>
    <!-- Loader Inicial -->
    <div class="initial-loader" id="initialLoader">
      <div class="loading-spinner"></div>
    </div>

    <div class="screen">
      <!-- Seção da Imagem (Desktop) -->
      <div class="image-section">
        <div class="floating-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        <div class="image-content">
          <div class="logo-display">
            <img
              src="https://i.ibb.co/q3TwvWPz/Chat-GPT-Image-23-de-ago-de-2025-19-32-11.png"
              alt="Altrum Logo"
              class="logo-image-large"
            />
          </div>
          <h2 class="welcome-title">Bem-vindo ao Altrum</h2>
          <p class="welcome-subtitle">
            Conecte-se ao futuro da generosidade digital
          </p>
        </div>
      </div>

      <!-- Seção do Login -->
      <div class="login-section">
        <div class="login-container">
          <div class="header-section">
            <div class="logo-container">
              <img
                src="https://i.ibb.co/q3TwvWPz/Chat-GPT-Image-23-de-ago-de-2025-19-32-11.png"
                alt="Altrum Logo"
                class="logo-image"
              />
            </div>
            <h1 class="app-title">Altrum</h1>
            <p class="app-subtitle">Faça login para continuar</p>
          </div>

          <div class="form-section">
            <form id="formLogin">
              <!-- Campo de E-mail -->
              <div class="input-group">
                <label class="input-label">E-mail</label>
                <div class="input-wrapper">
                  <input
                    type="email"
                    class="input-field"
                    placeholder="Digite seu e-mail"
                    id="email"
                    required
                    autocomplete="username"
                  />
                  <i class="fas fa-envelope input-icon"></i>
                </div>
                <div class="error-message" id="email-error"></div>
              </div>

              <!-- Campo de Senha -->
              <div class="input-group">
                <label class="input-label">Senha</label>
                <div class="input-wrapper">
                  <input
                    type="password"
                    class="input-field"
                    placeholder="Digite sua senha"
                    id="password"
                    required
                    autocomplete="current-password"
                  />
                  <i class="fas fa-lock input-icon"></i>
                  <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
                </div>
                <div class="error-message" id="password-error"></div>
              </div>

              <!-- Opções do Formulário -->
              <div class="form-options">
                <div class="remember-me-container">
                  <div class="checkbox-wrapper">
                    <input
                      type="checkbox"
                      id="rememberMe"
                      class="checkbox-input"
                    />
                    <label for="rememberMe" class="checkbox-custom"></label>
                  </div>
                  <label for="rememberMe" class="checkbox-label">
                    Lembre de mim
                  </label>
                </div>
                <div class="forgot-password">
                  <a href="/pages/forgot-password/html/forgot-password.html"
                    >Esqueceu a senha?</a
                  >
                </div>
              </div>

              <!-- Botão de Login -->
              <button type="submit" class="login-button">
                <i class="fas fa-sign-in-alt" style="margin-right: 8px"></i>
                Acessar
              </button>
            </form>

            <!-- Seção de Registro -->
            <div class="register-section">
              <p class="register-text">Não tem uma conta?</p>
              <a href="#register" class="register-link">
                <span>Registrar</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
    </div>

    <!-- Loader Pós-Login -->
    <div class="post-login-loader" id="postLoginLoader">
      <div class="loading-content">
        <img
          src="https://i.ibb.co/q3TwvWPz/Chat-GPT-Image-23-de-ago-de-2025-19-32-11.png"
          alt="Altrum Logo"
          class="loader-logo"
        />
        <div class="loading-spinner"></div>
        <p class="loader-version-text">VERSÃO BETA 1.0</p>
        <p class="loader-developer-text">Desenvolvido por Lênin Fontella.</p>
      </div>
    </div>

    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/login.js"></script>
  </body>
</html>
