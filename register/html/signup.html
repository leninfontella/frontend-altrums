<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - 1lênin1dev</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/signup.css" />
  </head>
  <body>
    <div class="phone-container">
      <div class="design-label">SIGNUP SCREEN</div>
      <div class="screen">
        <div class="notch"></div>

        <div class="status-bar">
          <span>9:41</span>
          <div style="display: flex; gap: 6px; align-items: center">
            <i class="fas fa-signal" style="font-size: 12px"></i>
            <i class="fas fa-wifi" style="font-size: 12px"></i>
            <i
              class="fas fa-battery-three-quarters"
              style="font-size: 12px"
            ></i>
          </div>
        </div>

        <div class="floating-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>

        <div class="signup-container">
          <div class="header-section">
            <div class="logo-container">
              <i class="fas fa-rocket logo-icon"></i>
            </div>
            <h1 class="app-title">Criar Conta</h1>
            <p class="app-subtitle">
              Junte-se à revolução da generosidade digital
            </p>
          </div>

          <div class="form-section">
            <div class="input-group">
              <label class="input-label">Nome Completo</label>
              <div class="input-wrapper">
                <input
                  type="text"
                  class="input-field"
                  placeholder="Digite seu nome completo"
                  id="fullname"
                />
                <i class="fas fa-user input-icon"></i>
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">E-mail</label>
              <div class="input-wrapper">
                <input
                  type="email"
                  class="input-field"
                  placeholder="Digite seu e-mail"
                  id="email"
                />
                <i class="fas fa-envelope input-icon"></i>
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">Telefone</label>
              <div class="input-wrapper">
                <input
                  type="tel"
                  class="input-field"
                  placeholder="(11) 99999-9999"
                  id="phone"
                />
                <i class="fas fa-phone input-icon"></i>
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">Senha</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  class="input-field"
                  placeholder="Crie uma senha segura"
                  id="password"
                />
                <i class="fas fa-lock input-icon"></i>
                <i
                  class="fas fa-eye password-toggle"
                  onclick="togglePassword('password')"
                ></i>
              </div>
              <div
                class="password-strength"
                id="passwordStrength"
                style="display: none"
              >
                <div class="strength-indicator">
                  <div class="strength-bar" id="bar1"></div>
                  <div class="strength-bar" id="bar2"></div>
                  <div class="strength-bar" id="bar3"></div>
                  <div class="strength-bar" id="bar4"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">Confirmar Senha</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  class="input-field"
                  placeholder="Confirme sua senha"
                  id="confirmPassword"
                />
                <i class="fas fa-lock input-icon"></i>
                <i
                  class="fas fa-eye password-toggle"
                  onclick="togglePassword('confirmPassword')"
                ></i>
              </div>
            </div>

            <div class="terms-section">
              <div class="checkbox-wrapper">
                <input type="checkbox" class="checkbox" id="terms" />
              </div>
              <div class="terms-text">
                Concordo com os
                <a href="../../term-and-policies/html/index.html"
                  >Termos de Uso</a
                >
                e
                <a href="../../term-and-policies/html/index.html"
                  >Política de Privacidade</a
                >
                do CoinFuture
              </div>
            </div>

            <button class="signup-button" id="signupBtn" disabled>
              Criar Minha Conta
            </button>
          </div>

          <div class="login-section">
            <p class="login-text">Já possui uma conta?</p>
            <a href="../../login/html/index.html" class="login-link"
              >Fazer Login</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../js/signup.js"></script>
  </body>
</html>
