<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - 1lênin1dev</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/profile.css" />
  </head>
  <body>
    <div class="phone-container">
      <div class="design-label">FIGMA DESIGN</div>
      <div class="screen">
        <div class="notch"></div>

        <div class="status-bar">
          <span>9:41</span>
          <div style="display: flex; gap: 6px; align-items: center">
            <i class="fas fa-signal" style="font-size: 12px"></i>
            <i class="fas fa-wifi" style="font-size: 12px"></i>
            <i
              class="fas fa-battery-three-quarters"
              style="font-size: 12px"
            ></i>
          </div>
        </div>

        <div class="header">
          <button id="go-back" class="back-button">
            <i class="fas fa-chevron-left"></i>
          </button>

          <div id="go-settings" class="header-title">Profile</div>
          <button id="go-settings-button" class="settings-button">
            <i class="fas fa-cog"></i>
          </button>
        </div>

        <div class="main-content">
          <div class="profile-card">
            <div class="profile-avatar">
              <i class="fas fa-user-astronaut"></i>
            </div>
            <!-- Aqui com IDs para atualizar dinamicamente -->
            <div id="profile-name" class="profile-name">Lênin Fontella</div>
            <div id="profile-email" class="profile-username">@lenin_sci</div>

            <div class="stats-grid">
              <div class="stat-item">
                <div class="stat-value">2.547</div>
                <div class="stat-label">Moedas</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">45</div>
                <div class="stat-label">Doações</div>
              </div>
            </div>
          </div>

          <div class="dashboard-section">
            <h3 class="section-title">
              <i class="fas fa-chart-line" style="color: #00d4ff"></i>
              Dashboard
            </h3>

            <div class="highlight-card">
              <div class="highlight-icon">
                <i class="fas fa-user-friends"></i>
              </div>
              <div class="highlight-text">
                <div class="highlight-title">Top Interação</div>
                <div class="highlight-name">Ana Silva</div>
                <div class="highlight-desc">24 interações este mês</div>
              </div>
            </div>

            <div class="chart-card">
              <div class="chart-header">
                <h4>Doações - Este Mês</h4>
              </div>
              <div class="chart-container">
                <div class="chart-legend">
                  <div class="legend-item">
                    <div class="legend-color donated"></div>
                    <span>Doadas: 15</span>
                  </div>
                  <div class="legend-item">
                    <div class="legend-color received"></div>
                    <span>Recebidas: 8</span>
                  </div>
                </div>
                <div class="mini-chart">
                  <div class="chart-bar donated" style="height: 65%"></div>
                  <div class="chart-bar received" style="height: 35%"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="goals-section">
            <h3 class="section-title">
              <i class="fas fa-target" style="color: #00ff88"></i>
              Metas Atuais
            </h3>
            <div class="goals-container">
              <div class="goal-item">
                <div class="goal-info">
                  <div class="goal-title">Doar 100 moedas este mês</div>
                  <div class="goal-progress-text">45/100</div>
                </div>
                <div class="goal-progress">
                  <div class="progress-bar" style="width: 45%"></div>
                </div>
              </div>

              <div class="goal-item">
                <div class="goal-info">
                  <div class="goal-title">Fazer 20 novas conexões</div>
                  <div class="goal-progress-text">12/20</div>
                </div>
                <div class="goal-progress">
                  <div class="progress-bar" style="width: 60%"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="menu-section">
            <button class="menu-item">
              <div class="menu-icon transactions">
                <i class="fas fa-history"></i>
              </div>
              <div class="menu-text">
                <div class="menu-title">Histórico</div>
                <div class="menu-subtitle">Ver todas as transações</div>
              </div>
              <i class="fas fa-chevron-right menu-arrow"></i>
            </button>

            <button class="menu-item">
              <div class="menu-icon security">
                <i class="fas fa-shield-alt"></i>
              </div>
              <div class="menu-text">
                <div class="menu-title">Segurança</div>
                <div class="menu-subtitle">Configurações de privacidade</div>
              </div>
              <i class="fas fa-chevron-right menu-arrow"></i>
            </button>

            <button class="menu-item">
              <div class="menu-icon help">
                <i class="fas fa-question-circle"></i>
              </div>
              <div id="go-support" class="menu-text">
                <div class="menu-title">Suporte</div>
                <div class="menu-subtitle">Ajuda e contato</div>
              </div>
              <i class="fas fa-chevron-right menu-arrow"></i>
            </button>
          </div>
        </div>

        <div class="bottom-nav">
          <div id="go-home" class="nav-item" data-tab="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
          </div>
          <div id="go-timeline" class="nav-item" data-tab="timeline">
            <i class="fas fa-history"></i>
            <span>Timeline</span>
          </div>
          <div id="go-ranks" class="nav-item" data-tab="ranks">
            <i class="fas fa-trophy"></i>
            <span>Ranks</span>
          </div>
          <div class="nav-item active" data-tab="profile">
            <i class="fas fa-user-circle"></i>
            <span>Profile</span>
          </div>
        </div>
      </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
